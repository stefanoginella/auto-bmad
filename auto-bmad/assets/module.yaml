code: abm
name: "Auto-BMAD Orchestrator"
description: "Drive the BMAD build lane end-to-end — bmad-build-auto plan → build → follow-up review per story, or a whole epic in one run (`/auto-bmad epic`) — from either story source: sprint-status.yaml or a bmad-spec spec folder's stories.yaml (`--spec <folder>`). Risk-gated TEA, epic-boundary gates + retrospective, git branch/commits/PR/CI and a report; every step delegated to a model-tuned subagent on Claude Code, Codex, or opencode."
module_version: 0.29.0
default_selected: false
module_greeting: >
  auto-bmad is installed. Run `/auto-bmad` in a BMAD project to drive the next story
  end-to-end (bmad-build-auto plan -> build -> follow-up review, plus risk-gated TEA and
  epic-boundary work), or `/auto-bmad epic` to drive a WHOLE epic in one run (one branch,
  one PR; it warns + confirms first). Stories come from sprint-status.yaml, or from a
  bmad-spec spec folder's stories.yaml -- add `--spec <folder>` (it asks which folder when
  there is no sprint status). You can steer a single run with plain-language
  instructions, e.g. `/auto-bmad stop before the review`. Prerequisites:
  BMAD >= 6.11, `uv` + Python 3.11, and nested subagents enabled for your host (preflight
  tells you the exact fix). Retune delegate models in `{output_folder}/auto-bmad/config.yaml`;
  run `/auto-bmad reprovision` after changing review-layer settings.

# --- No install-time variables. auto-bmad's runtime settings (models, TEA, git, review layers)
#     live exclusively in its own runtime config {output_folder}/auto-bmad/config.yaml, written by
#     the skill's first-run flow — NOT the installer-owned central BMAD config, which auto-bmad never
#     writes (it only reads output_folder + the BMM artifact paths from _bmad/config.toml). ---

post-install-notes: >
  auto-bmad delegates every step to your host's native subagents (Claude Code / Codex / opencode)
  using the models in the `profiles` block of `{output_folder}/auto-bmad/config.yaml` — nothing is
  rendered into your repo. Its extra review layers (security + cross-model) live in a marker-fenced
  region of `_bmad/custom/bmad-build-auto.toml` (project-wide: they also run for a manual
  `/bmad-build-auto`); `/auto-bmad reprovision` re-syncs that region. Requires `uv` + Python 3.11
  (bmad-build-auto renders through uv) and nested subagents (Codex: `[agents] max_depth = 2` or
  multi_agent_v2; opencode: `subagent_depth: 2`).
